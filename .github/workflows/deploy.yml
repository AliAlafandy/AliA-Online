name: Build and Deploy All Targets

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy-all"
  cancel-in-progress: true

jobs:
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    runs-on: ubuntu-latest
    needs: deploy-web
    outputs:
      apk_path: ${{ steps.apk.outputs.path }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web Assets
        run: |
          mkdir -p public
          cp index.html public/
      - name: Build Android APK
        run: |
          npm install
          npm install @capacitor/assets --save-dev
          npm run build
          npx cap add android || true
          npx cap sync android
      - name: url things and build game
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          with open('$MANIFEST_PATH', 'r') as f:
              content = f.read()
          intent_filter = '''
                  <intent-filter>
                      <action android:name=\"android.intent.action.VIEW\" />
                      <category android:name=\"android.intent.category.DEFAULT\" />
                      <category android:name=\"android.intent.category.BROWSABLE\" />
                      <data android:scheme=\"com.alia.online\" />
                  </intent-filter>
          '''
          new_content = content.replace('</activity>', intent_filter + '\n            </activity>', 1)
          with open('$MANIFEST_PATH', 'w') as f:
              f.write(new_content)
          "
          npx capacitor-assets generate --assetPath images
          cd android
          ./gradlew assembleRelease
      - name: Rename and Prepare APK
        id: apk
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "output/Ali-A_Online.apk" || cp android/app/build/outputs/apk/release/app-release.apk "output/Ali-A_Online.apk"
          echo "path=output/Ali-A_Online.apk" >> $GITHUB_OUTPUT
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output/Ali-A_Online.apk

  build-ios:
    runs-on: macos-latest
    needs: deploy-web
    outputs:
      ipa_path: ${{ steps.ipa.outputs.path }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare Web Assets
        run: |
          mkdir -p public
          cp index.html public/
      - name: Build iOS App & Package IPA
        run: |
          npm install
          npm install @capacitor/assets --save-dev
          npm run build
          npx cap add ios || true
          npx cap sync ios
      - name: Same thing as android
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string 'com.alialafandy.aliaonline'" "$PLIST_PATH"
          npx capacitor-assets generate --assetPath images
          cd ios/App
          xcodebuild -workspace "App.xcworkspace" \
                     -scheme "App" \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     build
          
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | grep -v "Intermediates" | head -n 1)
          echo "Found app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "Ali-A_Online.ipa" Payload
          rm -rf Payload
      - name: Prepare IPA Output
        id: ipa
        run: |
          mkdir -p output
          mv ios/App/"Ali-A_Online.ipa" output/
          echo "path=output/Ali-A_Online.ipa" >> $GITHUB_OUTPUT
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: output/Ali-A_Online.ipa

  github-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts
      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Ali-A_Online.apk
            artifacts/Ali-A_Online.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: "Ali-A Online v1.0.${{ github.run_number }}"
          body: "Mobile Web app Android / iOS."
          draft: false
          prerelease: true
