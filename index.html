<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliA Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
        }
        #mods-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .mod-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            width: 250px;
            text-align: center;
        }
        .mod-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #00ffcc;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
        .download-btn:hover {
            background-color: #00cc99;
        }
    </style>
</head>
<body>
    <h1>Welcome to AliA Online!</h1>
    <p>Check out the available mods below:</p>

    <div id="mods-container">Loading mods...</div>

    <script>
        fetch('mods.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('mods-container');
                container.innerHTML = '';
                data.mods.forEach(mod => {
                    const card = document.createElement('div');
                    card.className = 'mod-card';

                    card.innerHTML = `
                        <img src="${mod.icon || 'default-icon.png'}" alt="${mod.name}">
                        <h3>${mod.name}</h3>
                        <p>${mod.description || 'No description available.'}</p>
                        <a href="${mod.download_url}" class="download-btn" target="_blank">Download Mod</a>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error loading mods.json:', error);
                document.getElementById('mods-container').innerText = 'Failed to load mods.';
            });
    </script>
</body>
</html>
