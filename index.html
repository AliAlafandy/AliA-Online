<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliA Online Server And Mod Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #00ffcc; }
        .panel {
            background: #1e1e1e;
            padding: 20px;
            margin: 20px auto;
            max-width: 450px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        input, button {
            padding: 10px;
            margin: 8px;
            width: 80%;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
        }
        button {
            background-color: #00ffcc;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #00cc99; }
        .hidden { display: none !important; }
        .toggle-link {
            color: #00ffcc;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 10px;
            display: inline-block;
        }
        #mods-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .mod-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            width: 250px;
            text-align: center;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #00ffcc;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>AliA Online Server And Mod Uploader</h1>

    <div class="panel" id="auth-panel">
        
        <div id="login-form">
            <h3>Login to Your Account</h3>
            <input type="text" id="login-username" placeholder="Username"><br>
            <input type="password" id="login-password" placeholder="Password"><br>
            <button onclick="handleLogin()">Login</button>
            <p>Don't have an account? <span class="toggle-link" onclick="switchView('register')">Register here</span></p>
        </div>

        <div id="register-form" class="hidden">
            <h3>Create an Account</h3>
            <input type="text" id="reg-username" placeholder="Choose Username"><br>
            <input type="password" id="reg-password" placeholder="Choose Password"><br>
            <button onclick="handleRegister()">Register Account</button>
            <p>Already have an account? <span class="toggle-link" onclick="switchView('login')">Login here</span></p>
        </div>

    </div>

    <div class="panel hidden" id="upload-panel">
        <h3>Upload Mod & Manage</h3>
        <p>Logged in as: <span id="current-user" style="color: #00ffcc; font-weight: bold;"></span> <button onclick="logout()" style="width:auto; padding:2px 8px; margin-left: 10px;">Logout</button></p>
        <input type="text" id="mod-name" placeholder="Mod Name (e.g. superMod)"><br>
        <input type="text" id="mod-desc" placeholder="Mod Description"><br>
        <input type="file" id="mod-file" accept=".zip"><br>
        <button onclick="simulateUpload()">Generate Mod Link & Path</button>
    </div>

    <h2>Available Mods</h2>
    <div id="mods-container">Loading mods...</div>

    <script>
        const REPO_OWNer = "alialafandy";
        const REPO_NAME = "AliA-Online";

        function checkAuth() {
            const loggedUser = localStorage.getItem('alia_logged_in_user');
            if (loggedUser) {
                document.getElementById('auth-panel').classList.add('hidden');
                document.getElementById('upload-panel').classList.remove('hidden');
                document.getElementById('current-user').innerText = loggedUser;
            } else {
                document.getElementById('auth-panel').classList.remove('hidden');
                document.getElementById('upload-panel').classList.add('hidden');
            }
        }

        function switchView(view) {
            if (view === 'register') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
            } else {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
            }
        }

        function handleRegister() {
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value.trim();

            if (!user || !pass) {
                alert("Please fill in both fields.");
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('alia_accounts') || "{}");
            if (accounts[user]) {
                alert("Username already exists! Choose another or log in.");
                return;
            }

            accounts[user] = pass;
            localStorage.setItem('alia_accounts', JSON.stringify(accounts));
            
            localStorage.setItem('alia_logged_in_user', user);
            alert(`Account created successfully! Welcome, ${user}.`);
            checkAuth();
        }

        function handleLogin() {
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            let accounts = JSON.parse(localStorage.getItem('alia_accounts') || "{}");

            if (accounts[user] && accounts[user] === pass) {
                localStorage.setItem('alia_logged_in_user', user);
                alert(`Welcome back, ${user}!`);
                checkAuth();
            } else {
                alert("Invalid username or password.");
            }
        }

        function logout() {
            localStorage.removeItem('alia_logged_in_user');
            checkAuth();
        }

        function simulateUpload() {
            const user = localStorage.getItem('alia_logged_in_user');
            const modName = document.getElementById('mod-name').value.trim();
            const fileInput = document.getElementById('mod-file');

            if (!modName || fileInput.files.length === 0) {
                alert("Please provide a mod name and select a .zip file.");
                return;
            }

            const generatedUrl = `https://${REPO_OWNer}.github.io/${REPO_NAME}/${user}/mods/${modName}.zip`;
            alert(`Mod structured successfully!\n\nTarget Repository Path: ${user}/mods/${modName}.zip\nGenerated Link: ${generatedUrl}`);
            
            document.getElementById('mod-name').value = '';
            document.getElementById('mod-desc').value = '';
            fileInput.value = '';
        }

        fetch('mods.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('mods-container');
                container.innerHTML = '';
                data.mods.forEach(mod => {
                    container.innerHTML += `
                        <div class="mod-card">
                            <h3>${mod.name}</h3>
                            <p>${mod.description || ''}</p>
                            <a href="${mod.download_url}" class="download-btn" target="_blank">Download Mod</a>
                        </div>
                    `;
                });
            }).catch(() => document.getElementById('mods-container').innerText = "No mods found.");

        checkAuth();
    </script>
</body>
</html>
