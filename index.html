<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali-A Online</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6), 0 0 20px rgba(0, 255, 204, 0.4);
            letter-spacing: 2px;
        }
        h2 {
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
        }
        .panel {
            background: #16161a;
            padding: 25px;
            margin: 20px auto;
            max-width: 450px;
            border-radius: 12px;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
        }
        input, button {
            padding: 12px;
            margin: 10px 0;
            width: 85%;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111115;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }
        button {
            background-color: #00ffcc;
            color: #0d0d0d;
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
        }
        .hidden { display: none !important; }
        .toggle-link {
            color: #00ffcc;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 10px;
            display: inline-block;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
        }
        .toggle-link:hover {
            color: #ff007f;
        }
        #mods-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .mod-card {
            background-color: #16161a;
            border: 1px solid #ff007f;
            border-radius: 10px;
            padding: 20px;
            width: 250px;
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            transition: transform 0.3s ease;
        }
        .mod-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }
        .mod-icon {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #444;
            margin-bottom: 10px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background-color: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            background-color: #00ffcc;
            color: #0d0d0d;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
        }
    </style>
</head>
<body>
    <h1>Ali-A Online</h1>

    <div class="panel" id="auth-panel">
        <div id="login-form">
            <h3>Login to Your Account</h3>
            <input type="text" id="login-username" placeholder="Username"><br>
            <input type="password" id="login-password" placeholder="Password"><br>
            <button onclick="handleLogin()">Login</button>
            <p>Don't have an account? <span class="toggle-link" onclick="switchView('register')">Register here</span></p>
        </div>

        <div id="register-form" class="hidden">
            <h3>Create an Account</h3>
            <input type="text" id="reg-username" placeholder="New Username"><br>
            <input type="password" id="reg-password" placeholder="New Password"><br>
            <button onclick="handleRegister()">Register Account</button>
            <p>Already have an account? <span class="toggle-link" onclick="switchView('login')">Login here</span></p>
        </div>
    </div>

    <div class="panel hidden" id="upload-panel">
        <h3>Upload Mod & Auto-Update</h3>
        <p>Logged in as: <span id="current-user" style="color: #00ffcc; font-weight: bold;"></span> <button onclick="logout()" style="width:auto; padding:4px 10px; margin-left: 10px;">Logout</button></p>
        <input type="password" id="gh-token" placeholder="GitHub Personal Access Token"><br>
        <input type="text" id="mod-name" placeholder="Mod Name (e.g. superMod)"><br>
        <input type="text" id="mod-desc" placeholder="Mod Description"><br>
        <input type="file" id="mod-file" accept=".zip"><br>
        <button onclick="uploadModToGitHub()">Upload & Auto-Update JSON</button>
    </div>

    <h2>Available Mods</h2>
    <div id="mods-container">Loading mods...</div>

    <script>
        const REPO_OWNER = "alialafandy";
        const REPO_NAME = "AliA-Online";

        function checkAuth() {
            const loggedUser = localStorage.getItem('alia_logged_in_user');
            if (loggedUser) {
                document.getElementById('auth-panel').classList.add('hidden');
                document.getElementById('upload-panel').classList.remove('hidden');
                document.getElementById('current-user').innerText = loggedUser;
            } else {
                document.getElementById('auth-panel').classList.remove('hidden');
                document.getElementById('upload-panel').classList.add('hidden');
            }
        }

        function switchView(view) {
            if (view === 'register') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
            } else {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value.trim();
        
            if (!user || !pass) {
                alert("Please fill in both fields.");
                return;
            }
    
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await response.json();
        
                if (response.ok) {
                    localStorage.setItem('alia_logged_in_user', user);
                    alert(`Account created successfully! Welcome, ${user}.`);
                    checkAuth();
                } else {
                    alert(data.error || "Registration failed.");
                }
            } catch (err) {
                alert("Network error during registration.");
            }
        }
        
        async function handleLogin() {
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();
        
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await response.json();
        
                if (response.ok) {
                    localStorage.setItem('alia_logged_in_user', user);
                    alert(`Welcome back, ${user}!`);
                    checkAuth();
                } else {
                    alert(data.error || "Invalid username or password.");
                }
            } catch (err) {
                alert("Network error during login.");
            }
        }
        
        function logout() {
            localStorage.removeItem('alia_logged_in_user');
            checkAuth();
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        async function uploadModToGitHub() {
            const user = localStorage.getItem('alia_logged_in_user');
            const modName = document.getElementById('mod-name').value.trim();
            const modDesc = document.getElementById('mod-desc').value.trim();
            const fileInput = document.getElementById('mod-file');
        
            if (!modName || fileInput.files.length === 0) {
                alert("Please provide a mod name and select a .zip file.");
                return;
            }
        
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('username', user);
            formData.append('modName', modName);
            formData.append('modDesc', modDesc);
            formData.append('modFile', file);
        
            try {
                alert("Uploading mod through your server...");
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
        
                if (response.ok) {
                    alert("Success! Your mod file is uploaded and mods.json has been updated.");
                    location.reload();
                } else {
                    alert(data.error || "Upload failed.");
                }
            } catch (err) {
                console.error(err);
                alert("Upload failed. Check console for details.");
            }
        }

        fetch('mods.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('mods-container');
                container.innerHTML = '';
                data.mods.forEach(mod => {
                    container.innerHTML += `
                        <div class="mod-card">
                            <img src="${mod.icon || 'images/default-icon.png'}" alt="${mod.name}" class="mod-icon">
                            <h3>${mod.name}</h3>
                            <p>${mod.description || ''}</p>
                            <a href="${mod.download_url}" class="download-btn" target="_blank">Download Mod</a>
                        </div>
                    `;
                });
            }).catch(() => document.getElementById('mods-container').innerText = "No mods found.");

        checkAuth();
    </script>
</body>
</html>
